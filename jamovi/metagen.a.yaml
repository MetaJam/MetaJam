name: metaGen
title: Precomputed Effect Sizes Meta-Analysis
menuGroup: MetaJam
menuSubgroup: Precomputed Effect Sizes Meta-Analysis
menuTitle: Precomputed Effect Sizes
menuSubtitle: Effect Size, SE/CI
version: "1.0.0"
jas: "1.2"

options:
  - name: data
    type: Data

  - name: sm
    title: Effect measure
    type: List
    options:
      - title: Generic effect size
        name: GEN
      - title: Hazard ratio (HR)
        name: HR
      - title: Mean difference (MD)
        name: MD
      - title: Standardised mean difference (SMD)
        name: SMD
      - title: Ratio of means (ROM)
        name: ROM
      - title: Risk ratio (RR)
        name: RR
      - title: Odds ratio (OR)
        name: OR
      - title: Risk difference (RD)
        name: RD
      - title: Vaccine efficacy/effectiveness (VE)
        name: VE
      - title: Incidence rate ratio (IRR)
        name: IRR
      - title: Incidence rate difference (IRD)
        name: IRD
      - title: Square root transformed incidence rate difference (IRSD)
        name: IRSD
    default: GEN

  - name: inputMode
    title: ""
    type: List
    options:
      - title: Effect Size & SE
        name: se
      - title: Effect Size & CI
        name: ci
    default: se

  - name: studyLabel
    title: Study Label
    type: Variable
    suggested:
      - nominal
      - id
    permitted:
      - factor
      - id

  - name: effectSize
    title: Effect Size
    type: Variable
    suggested:
      - continuous
    permitted:
      - numeric

  - name: standardError
    title: Standard Error
    type: Variable
    suggested:
      - continuous
    permitted:
      - numeric

  - name: total
    title: Total (optional)
    type: Variable
    suggested:
      - continuous
    permitted:
      - numeric

  - name: ciStudyLabel
    title: Study Label
    type: Variable
    suggested:
      - nominal
      - id
    permitted:
      - factor
      - id

  - name: ciEffectSize
    title: Effect Size
    type: Variable
    suggested:
      - continuous
    permitted:
      - numeric

  - name: ciLevel
    title: Confidence level
    type: Number
    min: 50
    max: 99.9
    default: 95

  - name: ciLower
    title: Lower confidence limit
    type: Variable
    suggested:
      - continuous
    permitted:
      - numeric

  - name: ciUpper
    title: Upper confidence limit
    type: Variable
    suggested:
      - continuous
    permitted:
      - numeric

  - name: ciTotal
    title: Total (optional)
    type: Variable
    suggested:
      - continuous
    permitted:
      - numeric

  - name: model
    title: Model
    type: List
    options:
      - title: Random & common
        name: both
      - title: Random effects
        name: random
      - title: Common effect
        name: common
    default: both

  - name: methodTau
    title: Heterogeneity estimator
    type: List
    options:
      - title: Restricted maximum-likelihood
        name: REML
      - title: Paule-Mandel
        name: PM
      - title: DerSimonian-Laird
        name: DL
      - title: Maximum-likelihood
        name: ML
      - title: Hunter-Schmidt
        name: HS
      - title: Sidik-Jonkman
        name: SJ
      - title: Hedges
        name: HE
      - title: Empirical Bayes
        name: EB
    default: REML

  - name: methodRandomCi
    title: Random effects CI method
    type: List
    options:
      - title: Classic
        name: classic
      - title: Hartung-Knapp
        name: HK
    default: classic

  - name: prediction
    title: Prediction interval
    type: Bool
    default: false

  - name: confidenceLevel
    title: Confidence level
    type: Number
    min: 50
    max: 99.9
    default: 95

  - name: summary
    title: Summary
    type: Bool
    default: true

  - name: forestPlot
    title: Forest plot
    type: Bool
    default: true

  - name: forestMode
    title: ""
    type: List
    options:
      - title: General
        name: general
      - title: Dimensions
        name: dimensions
      - title: Rounding
        name: rounding
    default: general

  - name: forestLayout
    title: Theme
    type: List
    options:
      - title: Default
        name: meta
      - title: RevMan 5
        name: RevMan5
      - title: JAMA
        name: JAMA
      - title: BMJ
        name: BMJ
    default: meta

  - name: sortBy
    title: Sort by
    type: String
    default: none

  - name: sortDirection
    title: ""
    type: List
    options:
      - title: Ascending
        name: asc
      - title: Descending
        name: desc
    default: asc

  - name: sortVariable
    title: Sort variable
    type: Variable

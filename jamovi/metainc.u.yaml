name: metaInc
title: Incidence Rate Outcomes Meta-Analysis
jus: "3.0"
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    name: mainVariablesSupplier
    persistentItems: false
    stretchFactor: 1
    permitted:
      - numeric
      - factor
      - id
    children:
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: studyLabel
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: eventE
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: timeE
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: eventC
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: timeC
            maxItemCount: 1
            isTarget: true

  - type: CollapseBox
    label: Meta-Analysis
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        children:
          - type: ComboBox
            name: sm
      - type: LayoutBox
        children:
          - type: ComboBox
            name: method
      - type: LayoutBox
        fitToGrid: true
        children:
          - type: ComboBox
            name: correctionMethod
            cell:
              row: 0
              column: 0
          - type: TextBox
            name: incr
            format: number
            enable: (!(correctionMethod:none))
            width: normal
            cell:
              row: 0
              column: 1
      - type: LayoutBox
        children:
          - type: ComboBox
            name: model
      - type: LayoutBox
        children:
          - type: ComboBox
            name: methodTau
      - type: LayoutBox
        children:
          - type: ComboBox
            name: methodRandomCi
            enable: (!model:common)
      - type: CheckBox
        name: prediction
        enable: (!model:common)
      - type: LayoutBox
        children:
          - type: TextBox
            name: confidenceLevel
            format: number
            width: normal
            suffix: "%"
      - type: CheckBox
        name: summary

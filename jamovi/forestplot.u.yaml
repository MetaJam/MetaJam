name: forestPlot
title: Forest Plot Builder
jus: "3.0"
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: true
    stretchFactor: 1
    permitted:
      - numeric
      - factor
      - id
    children:
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: rowLabel
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: rowType
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: effectSize
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: ciLower
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: ciUpper
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: weight
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: leftColumns
            isTarget: true
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: rightColumns
            isTarget: true

  - type: CollapseBox
    label: Effect Size & CI
    collapsed: true
    stretchFactor: 1
    children:
      - type: CheckBox
        name: effectCi
        children:
          - type: ComboBox
            name: effectCiLayout
            enable: (effectCi)
          - type: ComboBox
            name: effectCiPosition
            enable: (effectCi)
          - type: ComboBox
            name: effectCiDigits
            enable: (effectCi)
          - type: TextBox
            name: effectHeader
            format: string
            width: large
            enable: (effectCi)
          - type: TextBox
            name: ciHeader
            format: string
            width: large
            enable: (effectCi)
            suggestedValues:
              - 90% CI
              - 95% CI
              - 99% CI
          - type: ComboBox
            name: ciBrackets
            enable: (effectCi && effectCiLayout:combined)
          - type: ComboBox
            name: ciSeparator
            enable: (effectCi)

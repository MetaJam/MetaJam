      - sm
      - method
      - correctionMethod
      - incr
      - model
      - methodTau
      - methodRandomCi
      - prediction
      - confidenceLevel
      - irscaleEnabled
      - irscale
      - irunit
      - nullEffectEnabled
      - nullEffect
      - leaveOneOutPrediction
      - leaveOneOutForestLayout
      - leaveOneOutSortBy
      - leaveOneOutSortDirection
      - leaveOneOutSortVariable
      - leaveOneOutForestDetails
      - leaveOneOutLabelLeft
      - leaveOneOutLabelRight
      - leaveOneOutXlimCustom
      - leaveOneOutXlimLower
      - leaveOneOutXlimUpper
      - leaveOneOutAddrowsCustom
      - leaveOneOutAddrowsBelowOverall
      - leaveOneOutColgapLeft
      - leaveOneOutColgapLeftUnit
      - leaveOneOutColgapRight
      - leaveOneOutColgapRightUnit
      - leaveOneOutColgapForestLeft
      - leaveOneOutColgapForestLeftUnit
      - leaveOneOutColgapForestRight
      - leaveOneOutColgapForestRightUnit
      - leaveOneOutDigitsEffect
      - leaveOneOutDigitsPval
      - leaveOneOutDigitsI2
      - leaveOneOutDigitsTau2
    refs:
      - MetaJam
      - metaPackage

  - name: cumulativeText

name: metaRate
title: Single Incidence Rates Meta-Analysis
jrs: "1.1"

items:
  - name: text
    type: Html
    visible: (summary)
    clearWith:
      - studyLabel
      - event
      - time
      - sm
      - method
      - correctionMethod
      - incr
      - model
      - methodTau
      - methodRandomCi
      - prediction
      - confidenceLevel
      - irscaleEnabled
      - irscale
      - irunit
      - nullEffectEnabled
      - nullEffect
    refs:
      - MetaJam
      - metaPackage

  - name: plotSizeCache
    type: Group
    visible: false
    clearWith: []
    items: []

  - name: plot
    title: Meta-Analysis Forest Plot
    type: Image
    mode: vector
    renderFun: .forestPlot
    visible: (forestPlot)
    clearWith:
      - studyLabel
      - event
      - time
      - sm
      - method
      - correctionMethod
      - incr
      - model
      - methodTau
      - methodRandomCi
      - prediction
      - confidenceLevel
      - irscaleEnabled
      - irscale
      - irunit
      - nullEffectEnabled
      - nullEffect
      - forestLayout
      - sortBy
      - sortDirection
      - sortVariable
      - forestTestOverall
      - forestDetails
      - forestPrintI2Ci
      - forestPrintTau2Ci
      - labelLeft
      - labelRight
      - xlimCustom
      - xlimLower
      - xlimUpper
      - addrowsCustom
      - addrowsBelowOverall
      - colgapLeft
      - colgapLeftUnit
      - colgapRight
      - colgapRightUnit
      - colgapForestLeft
      - colgapForestLeftUnit
      - colgapForestRight
      - colgapForestRightUnit
      - digitsEffect
      - digitsTime
      - digitsPval
      - digitsWeight
      - digitsI2
      - digitsTau2
    refs:
      - MetaJam
      - metaPackage

  - name: subgroupPlotSizeCache
    type: Group
    visible: false
    clearWith: []
    items: []

  - name: subgroupModels
    title: ""
    type: Array
    hideHeadingOnlyChild: true
    clearWith:
      - studyLabel
      - event
      - time
      - sm
      - method
      - correctionMethod
      - incr
      - model
      - methodTau
      - methodRandomCi
      - prediction
      - confidenceLevel
      - irscaleEnabled
      - irscale
      - irunit
      - nullEffectEnabled
      - nullEffect
      - subgroupVariables
      - tauCommon
      - predictionSubgroup
    template:
      title: ""
      type: Group
      items:
        - name: subgroupText
          type: Html
          visible: (subgroupSummary && length(subgroupVariables) > 0)
          clearWith: []
          refs:
            - MetaJam
            - metaPackage

        - name: subgroupPlot
          title: Subgroup Analysis Forest Plot
          type: Image
          mode: vector
          renderFun: .subgroupForestPlot
          visible: (subgroupForestPlot && length(subgroupVariables) > 0)
          clearWith:
            - printSubgroupName
            - subgroupForestLayout
            - subgroupSortBy
            - subgroupSortDirection
            - subgroupSortVariable
            - subgroupForestOverall
            - subgroupForestTestSubgroup
            - subgroupForestTestEffect
            - subgroupForestTestOverall
            - subgroupForestPrintI2Ci
            - subgroupForestPrintTau2Ci
            - subgroupForestDetails
            - subgroupLabelLeft
            - subgroupLabelRight
            - subgroupXlimCustom
            - subgroupXlimLower
            - subgroupXlimUpper
            - subgroupAddrowsCustom
            - subgroupAddrowsBelowOverall
            - subgroupColgapLeft
            - subgroupColgapLeftUnit
            - subgroupColgapRight
            - subgroupColgapRightUnit
            - subgroupColgapForestLeft
            - subgroupColgapForestLeftUnit
            - subgroupColgapForestRight
            - subgroupColgapForestRightUnit
            - subgroupDigitsEffect
            - subgroupDigitsTime
            - subgroupDigitsPval
            - subgroupDigitsWeight
            - subgroupDigitsI2
            - subgroupDigitsTau2
          refs:
            - MetaJam
            - metaPackage

  - name: metaRegModels
    title: ""
    type: Array
    hideHeadingOnlyChild: true
    clearWith:
      - studyLabel
      - event
      - time
      - sm
      - method
      - correctionMethod
      - incr
      - model
      - methodTau
      - methodRandomCi
      - prediction
      - confidenceLevel
      - irscaleEnabled
      - irscale
      - irunit
      - nullEffectEnabled
      - nullEffect
      - metaRegCovs
      - metaRegFactors
      - metaRegBlocks
      - metaRegIntercept
    template:
      title: ""
      type: Group
      items:
        - name: metaRegText
          type: Html
          visible: (metaRegSummary && (length(metaRegCovs) > 0 || length(metaRegFactors) > 0))
          clearWith: []
          refs:
            - MetaJam
            - metaPackage

        - name: bubblePlot
          title: Bubble Plot
          type: Image
          mode: vector
          width: 700
          height: 500
          renderFun: .bubblePlot
          visible: (bubblePlot && (length(metaRegCovs) > 0 || length(metaRegFactors) > 0))
          clearWith:
            - bubbleRegline
            - bubbleStudyLabel
          refs:
            - MetaJam
            - metaPackage

  - name: leaveOneOutText
    type: Html
    visible: (leaveOneOut && leaveOneOutSummary)
    clearWith:
      - studyLabel
      - event
      - time
      - sm
      - method
      - correctionMethod
      - incr
      - model
      - methodTau
      - methodRandomCi
      - prediction
      - confidenceLevel
      - irscaleEnabled
      - irscale
      - irunit
      - nullEffectEnabled

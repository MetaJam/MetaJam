datasets:
  - name: Nedocromil Sodium
    path: NedocromilSodium.omv
    description: >-
      Results from 17 trials, 11 studies in children and 6 studies in adults, on
      nedocromil sodium for preventing exercise-induced bronchoconstriction,
      reporting the maximum fall in forced expiratory volume in 1 second (FEV1)
      over the course of follow-up, expressed as a percentage (Spooner et al.,
      2002).
    tags:
      - Meta-Analysis
      - Continuous Outcomes
  - name: BCG Vaccine
    path: BCG.omv
    description: >-
      Results from 13 studies examining the effectiveness of the Bacillus
      Calmette-Guerin (BCG) vaccine against tuberculosis (Colditz et al., 1994).
    tags:
      - Meta-Analysis
      - Binary Outcomes
  - name: Adjusted-Dose Warfarin
    path: AdjustedDoseWarfarin.omv
    description: >-
      Results from 6 clinical trials examining the effectiveness of
      adjusted-dose warfarin for preventing strokes in patients with atrial
      fibrillation (Hart et al., 1999).
    tags:
      - Meta-Analysis
      - Incidence Rate Outcomes
  - name: Depression Severity
    path: DepressionSeverity.omv
    description: >-
      Baseline depression severity scores from 6 clinical trials of
      psychotherapy and antidepressant treatment in patients with major
      depression, measured using the Beck Depression Inventory-II (BDI-II)
      (Furukawa et al., 2020).
    tags:
      - Meta-Analysis
      - Single Means
  - name: Environmental Tobacco Smoke
    path: EnvironmentalTobaccoSmoke.omv
    description: >-
      Results from 37 studies examining the risk of lung cancer in lifelong
      nonsmoking women exposed to environmental tobacco smoke from their smoking
      spouse (Hackshaw et al., 1997).
    tags:
      - Meta-Analysis
      - Precomputed Effect Sizes
      - Odds Ratios
  - name: Purine Analogues
    path: PurineAnalogues.omv
    description: >-
      Results from 4 trials comparing single-agent purine analogues with
      alkylator-based regimens in patients with chronic lymphocytic leukaemia
      (Steurer et al., 2006).
    tags:
      - Meta-Analysis
      - Precomputed Effect Sizes
      - Hazard Ratios
  - name: RoB 2
    path: RoB2.omv
    description: Example risk-of-bias assessments for 9 studies using the RoB 2 tool.
    tags:
      - Risk of Bias
  - name: RoB 2 (cluster)
    path: RoB2Cluster.omv
    description: >-
      Example risk-of-bias assessments for 9 studies using RoB 2 for
      cluster-randomized trials.
    tags:
      - Risk of Bias
  - name: ROBINS-I
    path: ROBINSI.omv
    description: Example risk-of-bias assessments for 10 studies using the ROBINS-I tool.
    tags:
      - Risk of Bias
  - name: ROBINS-E
    path: ROBINSE.omv
    description: Example risk-of-bias assessments for 10 studies using the ROBINS-E tool.
    tags:
      - Risk of Bias
  - name: QUADAS-2
    path: QUADAS2.omv
    description: Example risk-of-bias assessments for 12 studies using the QUADAS-2 tool.
    tags:
      - Risk of Bias
  - name: QUIPS
    path: QUIPS.omv
    description: Example risk-of-bias assessments for 12 studies using the QUIPS tool.
    tags:
      - Risk of Bias
usesNative: true

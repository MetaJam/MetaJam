description: >-
  <b>MetaJam</b> is a comprehensive <b>meta</b>-analysis module for
  <b>jam</b>ovi, powered by the R package meta.<br><br> <b>Available
  Analyses:</b> <ul> <li><b>Two-Group Meta-Analysis:</b> <ul> <li><b>Continuous
  Outcomes:</b> Analyze continuous outcome data using mean, standard deviation,
  and sample size.</li> <li><b>Binary Outcomes:</b> Analyze binary outcome data
  using event counts and sample size.</li> <li><b>Incidence Rate Outcomes:</b>
  Analyze incidence rate outcome data using event counts and person-time.</li>
  </ul> </li> <li><b>Precomputed Effect Sizes Meta-Analysis:</b> Analyze
  precomputed effect sizes with standard errors or confidence intervals.</li>
  </ul> <b>Analysis Options:</b> Common-effect and random-effects models,
  subgroup analysis, meta-regression, leave-one-out analysis, cumulative
  meta-analysis, and publication bias.<br><br> <b>For documentation, tutorials,
  and support, please visit:</b> <a href="https://metajam.pages.dev"
  target="_blank">metajam.pages.dev</a><br><br> <small><i>* Note: This module is
  under active development. Future updates will add single-group and correlation
  meta-analyses, along with advanced meta-analytical extensions.</i></small>
analyses:

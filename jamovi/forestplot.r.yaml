name: forestPlot
title: Forest Plot Builder
jrs: "1.1"

items:
  - name: plotSizeCache
    type: Group
    visible: false
    clearWith: []
    items: []

  - name: plot
    title: Forest Plot
    type: Image
    mode: vector
    renderFun: .forestPlot
    clearWith:
      - rowLabel
      - rowType
      - effectSize
      - ciLower
      - ciUpper
      - weight
      - leftColumns
      - rightColumns
      - effectCi
      - effectCiLayout
      - effectCiPosition
      - effectCiDigits
      - effectHeader
      - ciHeader
      - ciBrackets
      - ciSeparator
    refs:
      - MetaJam
      - forestploter

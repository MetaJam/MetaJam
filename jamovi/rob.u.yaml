      - type: Label
        label: Plots
        stretchFactor: 1
        cell:
          row: 0
          column: 0
        children:
          - type: CheckBox
            name: summaryPlot
            enable: (!tool:ROB2-Cluster)
          - type: CheckBox
            name: trafficPlot
          - type: CheckBox
            name: combinedPlot
            enable: (!tool:ROB2-Cluster)
            children:
              - type: ComboBox
                name: combinedOrder
                enable: (combinedPlot && !tool:ROB2-Cluster)
              - type: ComboBox
                name: combinedTags
                enable: (combinedPlot && !tool:ROB2-Cluster)
      - type: Label
        label: Appearance
        stretchFactor: 1
        cell:
          row: 0
          column: 1
        children:
          - type: ComboBox
            name: colour
          - type: TextBox
            name: pointSize
            format: number
            enable: (trafficPlot || (combinedPlot && !tool:ROB2-Cluster))

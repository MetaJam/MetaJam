name: metaGen
title: Precomputed Effect Sizes Meta-Analysis
jus: "3.0"
stage: 0
compilerMode: tame
children:
  - type: LayoutBox
    children:
      - type: ComboBox
        name: sm

  - type: ModeSelector
    name: inputMode
    stretchFactor: 1
    children:
      - type: Content
        name: se
        children:
          - type: VariableSupplier
            name: mainVariablesSupplier
            persistentItems: false
            stretchFactor: 1
            permitted:
              - numeric
              - factor
              - id
            children:
              - type: TargetLayoutBox
                children:
                  - type: VariablesListBox
                    name: studyLabel
                    maxItemCount: 1
                    isTarget: true
              - type: TargetLayoutBox
                name: effectSizeTarget
                label: Effect Size
                children:
                  - type: VariablesListBox
                    name: effectSize
                    maxItemCount: 1
                    isTarget: true
              - type: TargetLayoutBox
                children:
                  - type: VariablesListBox
                    name: standardError
                    maxItemCount: 1
                    isTarget: true
              - type: TargetLayoutBox
                children:
                  - type: VariablesListBox
                    name: total
                    maxItemCount: 1
                    isTarget: true

      - type: Content
        name: ci
        children:
          - type: VariableSupplier
            name: ciVariablesSupplier
            persistentItems: false
            stretchFactor: 1
            permitted:
              - numeric
              - factor
              - id
            children:
              - type: TargetLayoutBox
                children:
                  - type: VariablesListBox
                    name: ciStudyLabel
                    maxItemCount: 1
                    isTarget: true
              - type: TargetLayoutBox
                name: ciEffectSizeTarget
                label: Effect Size
                children:
                  - type: VariablesListBox
                    name: ciEffectSize
                    maxItemCount: 1
                    isTarget: true
              - type: LayoutBox
                children:
                  - type: TextBox
                    name: ciLevel
                    format: number
                    width: normal
                    suffix: "%"
              - type: TargetLayoutBox
                children:
                  - type: VariablesListBox
                    name: ciLower
                    maxItemCount: 1
                    isTarget: true
              - type: TargetLayoutBox
                children:
                  - type: VariablesListBox
                    name: ciUpper
                    maxItemCount: 1
                    isTarget: true
              - type: TargetLayoutBox
                children:
                  - type: VariablesListBox
                    name: ciTotal
                    maxItemCount: 1
                    isTarget: true

  - type: CollapseBox
    label: Meta-Analysis
    collapsed: true
    stretchFactor: 1
    children:
      - type: LayoutBox
        children:
          - type: ComboBox
            name: model
      - type: LayoutBox
        children:
          - type: ComboBox
            name: methodTau
      - type: LayoutBox
        children:
          - type: ComboBox
            name: methodRandomCi
            enable: (!model:common)
      - type: CheckBox
        name: prediction
        enable: (!model:common)
      - type: LayoutBox
        children:
          - type: TextBox
            name: confidenceLevel
            format: number
            width: normal
            suffix: "%"
      - type: CheckBox
        name: summary
